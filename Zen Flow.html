<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zen Flow · Ambient Soundscapes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 16px;
            color: #e8e2da;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
            background: radial-gradient(circle at 20% 30%, #1f1b1e, #121013);
            border-radius: 64px 64px 48px 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 175, 0.04);
            padding: 32px 28px 40px;
            backdrop-filter: blur(2px);
            transition: 0.3s;
            border: 1px solid rgba(230, 200, 170, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(230, 200, 170, 0.08);
        }

        .header h1 {
            font-weight: 300;
            font-size: 2.2rem;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #f0e2d0, #cbb8a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(200, 170, 140, 0.1);
        }

        .header .sub {
            font-size: 0.75rem;
            letter-spacing: 2px;
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 16px;
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 175, 0.06);
        }

        .soundscape-container {
            background: rgba(10, 8, 10, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 28px 24px 32px;
            margin-bottom: 28px;
            border: 1px solid rgba(230, 200, 170, 0.06);
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.4);
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 80px;
            margin-bottom: 28px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(to top, #b8a89a, #e8d6c4);
            border-radius: 20px;
            height: 20px;
            transition: height 0.15s ease;
            box-shadow: 0 0 12px rgba(200, 170, 140, 0.15);
            opacity: 0.7;
        }

        .bar.active {
            opacity: 1;
            background: linear-gradient(to top, #d4b8a0, #f5e3d0);
            box-shadow: 0 0 20px rgba(220, 190, 160, 0.3);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 8px;
        }

        .btn {
            background: rgba(255, 215, 175, 0.04);
            border: 1px solid rgba(230, 200, 170, 0.12);
            color: #e8e2da;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 120px;
            justify-content: center;
        }

        .btn:hover {
            background: rgba(255, 215, 175, 0.10);
            border-color: rgba(230, 200, 170, 0.25);
            transform: scale(0.97);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: rgba(210, 180, 150, 0.12);
            border-color: rgba(230, 200, 170, 0.2);
            color: #f5ede5;
        }

        .btn-primary:hover {
            background: rgba(210, 180, 150, 0.2);
        }

        .btn-primary.active {
            background: rgba(210, 180, 150, 0.2);
            border-color: #cbb8a8;
            box-shadow: 0 0 30px rgba(200, 170, 140, 0.08);
        }

        .btn-icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 140px;
        }

        .slider-group label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 215, 175, 0.15);
            border-radius: 20px;
            outline: none;
            accent-color: #dcc6b4;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #dcc6b4;
            box-shadow: 0 0 20px rgba(200, 170, 140, 0.2);
            cursor: pointer;
            border: 1px solid rgba(255, 215, 175, 0.2);
        }

        .scene-label {
            text-align: center;
            margin: 16px 0 8px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0.6;
            font-weight: 300;
        }

        .scene-label span {
            background: rgba(255, 215, 175, 0.04);
            padding: 4px 20px;
            border-radius: 40px;
            border: 1px solid rgba(230, 200, 170, 0.04);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(230, 200, 170, 0.06);
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 1px;
        }

        .footer .timer {
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.2);
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 175, 0.04);
        }

        @media (max-width: 500px) {
            .app-container { padding: 20px 16px; }
            .header h1 { font-size: 1.6rem; }
            .controls-row { gap: 12px; }
            .btn { padding: 10px 18px; min-width: 80px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="app-container" role="main">
    <div class="header">
        <h1>ZEN · FLOW</h1>
        <div class="sub">⏣  ambient</div>
    </div>

    <div class="soundscape-container">
        <div class="visualizer" id="visualizerBars" aria-label="Audio visualizer"></div>

        <div class="controls-row">
            <button class="btn btn-primary" id="playBtn" aria-label="Play / Pause">
                <span class="btn-icon">▶</span> <span id="playLabel">PLAY</span>
            </button>
            <button class="btn" id="sceneBtn" aria-label="Change soundscape">
                <span class="btn-icon">🌿</span> <span id="sceneLabel">Forest</span>
            </button>
        </div>

        <div class="controls-row">
            <div class="slider-group">
                <label>音量 <span id="volumeVal">60</span></label>
                <input type="range" id="volumeSlider" min="0" max="100" value="60">
            </div>
            <div class="slider-group">
                <label>雰囲気 <span id="atmosVal">50</span></label>
                <input type="range" id="atmosSlider" min="0" max="100" value="50">
            </div>
        </div>

        <div class="scene-label">
            <span id="sceneDesc">🌲 深い森 · 水の音</span>
        </div>
    </div>

    <div class="footer">
        <div>⏵ 瞑想 · リラックス</div>
        <div class="timer" id="timerDisplay">00:00</div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // DOM refs
        const visualizerEl = document.getElementById('visualizerBars');
        const playBtn = document.getElementById('playBtn');
        const playLabel = document.getElementById('playLabel');
        const sceneBtn = document.getElementById('sceneBtn');
        const sceneLabel = document.getElementById('sceneLabel');
        const sceneDesc = document.getElementById('sceneDesc');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.getElementById('volumeVal');
        const atmosSlider = document.getElementById('atmosSlider');
        const atmosVal = document.getElementById('atmosVal');
        const timerDisplay = document.getElementById('timerDisplay');

        // Audio state
        let audioCtx = null;
        let isPlaying = false;
        let isInitialized = false;

        // Audio nodes
        let oscNodes = [];
        let gainNodes = [];
        let filterNodes = [];
        let lfoNodes = [];
        let lfoGainNodes = [];
        let noiseNode = null;
        let noiseGain = null;
        let noiseFilter = null;
        let reverbNode = null;
        let reverbGain = null;
        let masterGain = null;
        let allConnections = [];

        // Animation
        let animFrameId = null;
        let isAnimating = false;

        // Timer
        let startTime = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;

        // Scene config
        const SCENES = [
            { 
                id: 'forest', 
                label: 'Forest', 
                desc: '🌲 深い森 · 水の音',
                freqs: [110, 165, 220, 330, 440, 550],
                noiseType: 'brown',
                filterFreq: 800,
                reverbMix: 0.3,
                lfoRate: 0.2,
            },
            { 
                id: 'ocean', 
                label: 'Ocean', 
                desc: '🌊 潮騒 · 波のうねり',
                freqs: [80, 120, 180, 240, 360, 480],
                noiseType: 'pink',
                filterFreq: 500,
                reverbMix: 0.5,
                lfoRate: 0.08,
            },
            { 
                id: 'temple', 
                label: 'Temple', 
                desc: '🕯️ 寺院 · 梵鐘',
                freqs: [130, 195, 260, 390, 520, 650],
                noiseType: 'brown',
                filterFreq: 1200,
                reverbMix: 0.6,
                lfoRate: 0.05,
            },
            { 
                id: 'aurora', 
                label: 'Aurora', 
                desc: '🌌 オーロラ · 星のきらめき',
                freqs: [200, 300, 450, 600, 800, 1000],
                noiseType: 'pink',
                filterFreq: 1500,
                reverbMix: 0.4,
                lfoRate: 0.15,
            },
        ];

        let currentSceneIndex = 0;

        // Helper: create noise buffer
        function createNoiseBuffer(type, length = 2) {
            if (!audioCtx) return null;
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * length;
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);

            if (type === 'brown') {
                let last = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = (Math.random() * 2 - 1) * 0.4;
                    last = (last + white) * 0.95;
                    data[i] = last * 0.8;
                }
            } else { // pink
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    b6 = white * 0.115926;
                }
                let max = 0;
                for (let i = 0; i < bufferSize; i++) {
                    if (Math.abs(data[i]) > max) max = Math.abs(data[i]);
                }
                if (max > 0) {
                    for (let i = 0; i < bufferSize; i++) data[i] /= max;
                }
            }
            return buffer;
        }

        // Clean up audio nodes properly
        function cleanupNodes() {
            // Disconnect and stop all oscillators
            oscNodes.forEach(osc => {
                try { 
                    osc.stop(); 
                    osc.disconnect(); 
                } catch(e) {}
            });
            oscNodes = [];

            gainNodes.forEach(gain => {
                try { gain.disconnect(); } catch(e) {}
            });
            gainNodes = [];

            filterNodes.forEach(filter => {
                try { filter.disconnect(); } catch(e) {}
            });
            filterNodes = [];

            // Cleanup LFOs
            lfoNodes.forEach(lfo => {
                try { 
                    lfo.stop(); 
                    lfo.disconnect(); 
                } catch(e) {}
            });
            lfoNodes = [];

            lfoGainNodes.forEach(gain => {
                try { gain.disconnect(); } catch(e) {}
            });
            lfoGainNodes = [];

            // Cleanup noise
            if (noiseNode) {
                try { 
                    noiseNode.stop(); 
                    noiseNode.disconnect(); 
                } catch(e) {}
                noiseNode = null;
            }
            if (noiseGain) {
                try { noiseGain.disconnect(); } catch(e) {}
                noiseGain = null;
            }
            if (noiseFilter) {
                try { noiseFilter.disconnect(); } catch(e) {}
                noiseFilter = null;
            }

            // Cleanup reverb
            if (reverbNode) {
                try { reverbNode.disconnect(); } catch(e) {}
                reverbNode = null;
            }
            if (reverbGain) {
                try { reverbGain.disconnect(); } catch(e) {}
                reverbGain = null;
            }

            // Cleanup master
            if (masterGain) {
                try { masterGain.disconnect(); } catch(e) {}
                masterGain = null;
            }

            allConnections = [];
        }

        // Build soundscape
        function buildSoundscape() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Resume context if suspended
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Cleanup existing nodes first
            cleanupNodes();

            // Master gain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = parseFloat(volumeSlider.value) / 100;
            masterGain.connect(audioCtx.destination);

            // Reverb
            reverbNode = audioCtx.createConvolver();
            reverbGain = audioCtx.createGain();
            reverbGain.gain.value = 0.3;

            const impulseLength = audioCtx.sampleRate * 1.5;
            const impulse = audioCtx.createBuffer(2, impulseLength, audioCtx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = impulse.getChannelData(ch);
                for (let i = 0; i < impulseLength; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (impulseLength * 0.3));
                }
            }
            reverbNode.buffer = impulse;
            reverbNode.connect(reverbGain);
            reverbGain.connect(masterGain);

            // Oscillators
            const scene = SCENES[currentSceneIndex];
            const freqs = scene.freqs;
            const lfoRate = scene.lfoRate;

            freqs.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = (idx % 2 === 0) ? 'sine' : 'triangle';
                osc.frequency.value = freq * (0.98 + 0.04 * Math.random());

                filter.type = 'lowpass';
                filter.frequency.value = scene.filterFreq * (0.7 + 0.6 * Math.random());
                filter.Q.value = 0.5 + Math.random() * 0.8;

                const pan = (idx / freqs.length) * 2 - 1;
                const gainVal = 0.06 + 0.04 * (1 - Math.abs(pan));
                gain.gain.value = gainVal;

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                // Reverb send
                const sendGain = audioCtx.createGain();
                sendGain.gain.value = 0.15 + 0.1 * Math.random();
                gain.connect(sendGain);
                sendGain.connect(reverbNode);

                oscNodes.push(osc);
                gainNodes.push(gain);
                filterNodes.push(filter);

                osc.start();

                // LFO
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.type = 'sine';
                lfo.frequency.value = lfoRate * (0.7 + 0.6 * Math.random());
                lfoGain.gain.value = 5 + 8 * Math.random();
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start();

                lfoNodes.push(lfo);
                lfoGainNodes.push(lfoGain);
            });

            // Noise layer
            const noiseType = scene.noiseType;
            const noiseBuffer = createNoiseBuffer(noiseType, 3);
            if (noiseBuffer) {
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.05 + 0.04 * (parseFloat(atmosSlider.value) / 100);

                noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = scene.filterFreq * 0.6;
                noiseFilter.Q.value = 0.5;

                noiseNode.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(masterGain);

                // Noise reverb send
                const noiseSend = audioCtx.createGain();
                noiseSend.gain.value = 0.3;
                noiseGain.connect(noiseSend);
                noiseSend.connect(reverbNode);

                noiseNode.start();
            }
        }

        // Start/Stop audio
        function startAudio() {
            if (isPlaying) return;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Resume context (important for Chrome)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    buildSoundscape();
                    isPlaying = true;
                    updatePlayButton();
                    startTimer();
                    startVisualizer();
                    updateSceneDisplay();
                }).catch(err => {
                    console.warn('Audio resume failed:', err);
                });
            } else {
                buildSoundscape();
                isPlaying = true;
                updatePlayButton();
                startTimer();
                startVisualizer();
                updateSceneDisplay();
            }
        }

        function stopAudio() {
            if (!isPlaying) return;
            
            isPlaying = false;
            updatePlayButton();
            stopTimer();
            stopVisualizer();
            cleanupNodes();
        }

        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                startAudio();
            }
        }

        // Visualizer
        function startVisualizer() {
            if (isAnimating) return;
            isAnimating = true;
            animateVisualizer();
        }

        function stopVisualizer() {
            isAnimating = false;
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            // Reset bars to idle
            updateBarsIdle();
        }

        function animateVisualizer() {
            if (!isAnimating) return;

            if (!isPlaying) {
                updateBarsIdle();
                animFrameId = requestAnimationFrame(animateVisualizer);
                return;
            }

            const barCount = 20;
            const bars = document.querySelectorAll('.bar');
            if (!bars.length) {
                animFrameId = requestAnimationFrame(animateVisualizer);
                return;
            }

            // Get audio levels
            let sum = 0;
            let count = 0;
            gainNodes.forEach(g => {
                try {
                    const val = g.gain.value;
                    sum += val;
                    count++;
                } catch(e) {}
            });
            const avg = count > 0 ? sum / count : 0.05;
            const base = Math.min(avg * 20, 1.0);

            let noiseVal = 0;
            if (noiseGain) {
                try { noiseVal = noiseGain.gain.value * 2; } catch(e) {}
            }
            const combined = Math.min(base + noiseVal * 0.5, 1.0);

            for (let i = 0; i < barCount; i++) {
                const bar = bars[i];
                if (!bar) continue;
                const variation = 0.4 + 0.6 * Math.sin(i * 1.7 + Date.now() * 0.002);
                const height = 10 + 60 * combined * variation * (0.5 + 0.5 * (i / barCount));
                bar.style.height = Math.min(height, 75) + 'px';
                bar.classList.add('active');
            }

            animFrameId = requestAnimationFrame(animateVisualizer);
        }

        function updateBarsIdle() {
            const bars = document.querySelectorAll('.bar');
            const time = Date.now() * 0.001;
            for (let i = 0; i < bars.length; i++) {
                const bar = bars[i];
                if (!bar) continue;
                const val = 0.3 + 0.2 * Math.sin(time * 0.8 + i * 0.9) + 0.1 * Math.sin(time * 1.3 + i * 0.4);
                bar.style.height = (12 + 30 * val) + 'px';
                bar.classList.remove('active');
            }
        }

        // Timer
        function startTimer() {
            elapsedSeconds = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000); // Fixed: 1000ms for accuracy
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Scene management
        function cycleScene() {
            currentSceneIndex = (currentSceneIndex + 1) % SCENES.length;
            updateSceneDisplay();

            if (isPlaying) {
                // Rebuild with new scene
                const wasPlaying = isPlaying;
                stopAudio();
                setTimeout(() => {
                    if (wasPlaying) {
                        startAudio();
                    }
                }, 50);
            }
        }

        function updateSceneDisplay() {
            const scene = SCENES[currentSceneIndex];
            sceneLabel.textContent = scene.label;
            sceneDesc.textContent = scene.desc;
        }

        // UI Updates
        function updatePlayButton() {
            if (isPlaying) {
                playLabel.textContent = 'PAUSE';
                playBtn.querySelector('.btn-icon').textContent = '⏸';
                playBtn.classList.add('active');
            } else {
                playLabel.textContent = 'PLAY';
                playBtn.querySelector('.btn-icon').textContent = '▶';
                playBtn.classList.remove('active');
            }
        }

        function updateVolume(val) {
            volumeVal.textContent = val;
            if (masterGain) {
                masterGain.gain.value = val / 100;
            }
        }

        function updateAtmosphere(val) {
            atmosVal.textContent = val;
            const scene = SCENES[currentSceneIndex];
            if (noiseGain) {
                const base = 0.02 + 0.06 * (val / 100);
                noiseGain.gain.value = base;
            }
            if (reverbGain) {
                const mix = 0.1 + 0.6 * (val / 100);
                reverbGain.gain.value = mix;
            }
            gainNodes.forEach((g, idx) => {
                try {
                    const pan = (idx / gainNodes.length) * 2 - 1;
                    const base = 0.04 + 0.06 * (1 - Math.abs(pan));
                    const atmosFactor = 0.7 + 0.6 * (val / 100);
                    g.gain.value = base * atmosFactor;
                } catch(e) {}
            });
        }

        // Build visualizer bars
        function buildVisualizerBars() {
            visualizerEl.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (12 + Math.random() * 20) + 'px';
                visualizerEl.appendChild(bar);
            }
        }

        // Initialize
        function init() {
            buildVisualizerBars();
            updateSceneDisplay();
            updateVolume(parseInt(volumeSlider.value));
            updateAtmosphere(parseInt(atmosSlider.value));
            
            // Start idle animation
            isAnimating = true;
            animateVisualizer();

            // Event listeners
            playBtn.addEventListener('click', togglePlay);
            sceneBtn.addEventListener('click', cycleScene);
            
            volumeSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                updateVolume(val);
            });

            atmosSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                updateAtmosphere(val);
            });

            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' && e.target === document.body) {
                    e.preventDefault();
                    togglePlay();
                }
            });

            // Handle page visibility
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isPlaying) {
                    // Reduce CPU usage when hidden
                    if (animFrameId) {
                        cancelAnimationFrame(animFrameId);
                        animFrameId = null;
                    }
                } else if (!document.hidden && isPlaying) {
                    // Resume animation
                    if (!animFrameId) {
                        animateVisualizer();
                    }
                }
            });

            console.log('🌊 Zen Flow · ambient soundscapes ready');
        }

        // Start everything
        init();

    })();
</script>
</body>
</html>
