    <style>
        /* ---------- RESET / BASE ---------- */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121216;
            --bg-card: rgba(20, 20, 25, 0.75);
            --text-primary: #f0ece4;
            --text-secondary: #b8b0a4;
            --text-muted: #827c73;
            --accent: #cc2222;
            --accent-glow: rgba(204, 34, 34, 0.45);
            --accent-gold: #d4af37;
            --line: rgba(255, 255, 255, 0.08);
            --font-jp: 'Noto Serif JP', serif;
            --font-en: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-full: 9999px;
            --radius-card: 20px;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-en);
            overflow-x: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- PRELOADER ---------- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #preloader .ring {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #preloader .jp-text {
            font-family: var(--font-jp);
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            color: var(--accent);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- CUSTOM CURSOR ---------- */
        #cursor {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease-out, width 0.25s, height 0.25s, background-color 0.25s;
            mix-blend-mode: screen;
            box-shadow: 0 0 15px var(--accent);
        }
        #cursor.grow {
            width: 40px;
            height: 40px;
            background: rgba(204, 34, 34, 0.3);
            border: 1px solid var(--accent);
            margin-top: -14px;
            margin-left: -14px;
        }
        @media (pointer: coarse) {
            #cursor { display: none !important; }
        }

        /* ---------- RAIN CANVAS BACKGROUND ---------- */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
        }

        /* ---------- UTILITIES & CONTAINERS ---------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 32px);
            width: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- HEADER ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--line);
            padding: 16px 0;
            width: 100%;
        }
        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo {
            font-family: var(--font-jp);
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }
        .logo span {
            color: var(--accent);
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 12px 28px;
            border-radius: var(--radius-full);
            font-weight: 500;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-family: var(--font-en);
            white-space: nowrap;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(204, 34, 34, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(204, 34, 34, 0.55);
            color: #ffffff;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.14);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: rgba(204, 34, 34, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* ---------- HERO / PROFILE CARD SECTION ---------- */
        #hero {

            align-items: center;
            justify-content: center;

        /* ---------- HERO PHOTO ---------- */

            align-items: center;

        .hero-profile img {

    <!-- INTERACTION LOGIC -->
    <script>
        // 1. PRELOADER
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            if (preloader) preloader.classList.add('hidden');
        });

        // 2. CUSTOM CURSOR
        (function initCursor() {
            const cursor = document.getElementById('cursor');
            if (!cursor) return;
            let pos = { x: 0, y: 0 };
            let target = { x: 0, y: 0 };

            document.addEventListener('mousemove', (e) => {
                target.x = e.clientX;
                target.y = e.clientY;
                if (cursor.style.display === 'none') {
                    cursor.style.display = 'block';
                }
            });

            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
            });

            document.querySelectorAll('a, .btn, .social-link').forEach((el) => {
                el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
            });

            function animateCursor() {
                pos.x += (target.x - pos.x) * 0.12;
                pos.y += (target.y - pos.y) * 0.12;
                cursor.style.transform = `translate(${pos.x - 6}px, ${pos.y - 6}px)`;
                requestAnimationFrame(animateCursor);
            }
            animateCursor();
        })();

        // 3. ATMOSPHERIC RAIN CANVAS
        (function initRain() {
            const canvas = document.getElementById('rain-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W, H;
            const drops = [];
            const COUNT = 160;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Drop {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * W;
                    this.y = initial ? Math.random() * H : -20;
                    this.len = 10 + Math.random() * 20;
                    this.speed = 10 + Math.random() * 16;
                    this.opacity = 0.08 + Math.random() * 0.22;
                    this.wind = -0.5;
                }
                update() {
                    this.y += this.speed;
                    this.x += this.wind;
                    if (this.y > H + 20) {
                        this.reset();
                    }
                }
                draw() {
                    ctx.strokeStyle = `rgba(204, 34, 34, ${this.opacity})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.wind * 2, this.y + this.len);
                    ctx.stroke();
                }
            }

            for (let i = 0; i < COUNT; i++) {
                drops.push(new Drop());
            }

            function drawRain() {
                ctx.clearRect(0, 0, W, H);
                for (const d of drops) {
                    d.update();
                    d.draw();
                }
                requestAnimationFrame(drawRain);
            }
            drawRain();
        })();
    </script>
