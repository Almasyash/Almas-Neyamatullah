<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void CMS · headless</title>
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0c;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0dcd6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ----- main container (dark minimal) ----- */
        .void-container {
            max-width: 1100px;
            width: 100%;
            background: #121113;
            border-radius: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
            padding: 32px 32px 40px;
            backdrop-filter: blur(2px);
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ----- header ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f0ece6, #b8aea4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo small {
            font-size: 0.8rem;
            letter-spacing: 2px;
            opacity: 0.3;
            -webkit-text-fill-color: #888;
            margin-left: 10px;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #a0988e;
        }

        .btn-void {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0dcd6;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-void:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-primary {
            background: rgba(220, 210, 200, 0.06);
            border-color: rgba(220, 210, 200, 0.12);
        }

        .btn-primary:hover {
            background: rgba(220, 210, 200, 0.12);
        }

        /* ----- stats row (minimal) ----- */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 30px;
            margin-bottom: 32px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #8a827a;
        }

        .stat-item strong {
            color: #e8e2da;
            font-weight: 400;
            font-size: 1rem;
        }

        /* ----- content grid (entries)----- */
        .entry-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 28px;
        }

        .entry-row {
            display: grid;
            grid-template-columns: 2fr 1.2fr 0.9fr 0.6fr 0.6fr;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            border: 1px solid transparent;
            transition: 0.15s;
            gap: 8px;
        }

        .entry-row.header-row {
            background: transparent;
            border: none;
            padding: 6px 18px 10px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6a625a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .entry-row:not(.header-row):hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .entry-cell {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entry-cell.title {
            font-weight: 400;
            color: #ece8e2;
        }

        .entry-cell.status {
            font-size: 0.7rem;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-badge.published {
            background: rgba(100, 200, 150, 0.06);
            border-color: rgba(100, 200, 150, 0.12);
            color: #9ed4b8;
        }

        .status-badge.draft {
            background: rgba(200, 180, 140, 0.04);
            border-color: rgba(200, 180, 140, 0.08);
            color: #c8bca8;
        }

        .entry-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .entry-actions button {
            background: transparent;
            border: none;
            color: #6a625a;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            transition: 0.15s;
        }

        .entry-actions button:hover {
            color: #e0dcd6;
            background: rgba(255, 255, 255, 0.03);
        }

        /* ----- form (minimal) ----- */
        .form-section {
            margin-top: 8px;
            padding: 24px 20px 20px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 160px;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6a625a;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 0.9rem;
            color: #e8e2da;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
        }

        .form-group input::placeholder {
            color: #4a4440;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        /* ----- empty state ----- */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #4a4440;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 1px dashed rgba(255, 255, 255, 0.02);
            border-radius: 32px;
        }

        /* ----- toast / feedback ----- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1b1a;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #d0c8c0;
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
            letter-spacing: 0.5px;
        }

        .toast.show {
            opacity: 1;
        }

        /* ----- responsive ----- */
        @media (max-width: 780px) {
            .void-container { padding: 20px 16px; }
            .entry-row {
                grid-template-columns: 1.5fr 1fr 0.8fr 0.5fr 0.5fr;
                padding: 12px 12px;
                font-size: 0.8rem;
            }
            .header { flex-direction: column; align-items: flex-start; }
            .form-row { flex-direction: column; align-items: stretch; }
        }

        @media (max-width: 550px) {
            .entry-row {
                grid-template-columns: 1.2fr 0.8fr 0.6fr 0.4fr 0.4fr;
                font-size: 0.7rem;
                padding: 10px 8px;
                gap: 4px;
            }
            .entry-row.header-row { display: none; }
            .entry-actions button { font-size: 0.6rem; padding: 2px 6px; }
        }
    </style>
</head>
<body>
    <div class="void-container" id="app">
        <!-- header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">VOID <small>CMS</small></div>
                <span class="badge">headless · v0.1</span>
            </div>
            <div class="header-actions">
                <button class="btn-void" id="resetDataBtn" title="Reset to sample data">⟲ reset</button>
                <button class="btn-void btn-primary" id="exportBtn">⬇ export</button>
            </div>
        </header>

        <!-- stats -->
        <div class="stats">
            <div class="stat-item">entries <strong id="entryCount">0</strong></div>
            <div class="stat-item">published <strong id="publishedCount">0</strong></div>
            <div class="stat-item">drafts <strong id="draftCount">0</strong></div>
        </div>

        <!-- entries list -->
        <div id="entryList" class="entry-grid">
            <!-- header row -->
            <div class="entry-row header-row">
                <div class="entry-cell">title</div>
                <div class="entry-cell">slug</div>
                <div class="entry-cell">status</div>
                <div class="entry-cell">updated</div>
                <div class="entry-cell" style="text-align:right;">actions</div>
            </div>
            <!-- dynamic rows injected here -->
        </div>

        <!-- form: add / edit -->
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="entryTitle">title</label>
                    <input type="text" id="entryTitle" placeholder="Enter title..." />
                </div>
                <div class="form-group">
                    <label for="entrySlug">slug</label>
                    <input type="text" id="entrySlug" placeholder="url-friendly" />
                </div>
                <div class="form-group" style="min-width:120px;">
                    <label for="entryStatus">status</label>
                    <select id="entryStatus">
                        <option value="draft">draft</option>
                        <option value="published">published</option>
                    </select>
                </div>
                <div class="form-group" style="min-width:100px; flex:0.5;">
                    <div class="form-actions">
                        <button class="btn-void" id="saveEntryBtn" style="padding:10px 28px;">+ save</button>
                        <button class="btn-void" id="cancelEditBtn" style="padding:10px 20px; opacity:0.4;">cancel</button>
                    </div>
                </div>
            </div>
            <div style="margin-top:10px; font-size:0.65rem; letter-spacing:0.5px; color:#4a4440;">
                <span id="editHint">— create new entry</span>
            </div>
        </div>

        <!-- toast -->
        <div id="toast" class="toast"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ----- data store -----
            let entries = [];
            let nextId = 1;

            // editing state
            let editingId = null;

            // DOM refs
            const entryListEl = document.getElementById('entryList');
            const entryCountEl = document.getElementById('entryCount');
            const publishedCountEl = document.getElementById('publishedCount');
            const draftCountEl = document.getElementById('draftCount');

            const titleInput = document.getElementById('entryTitle');
            const slugInput = document.getElementById('entrySlug');
            const statusSelect = document.getElementById('entryStatus');
            const saveBtn = document.getElementById('saveEntryBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');
            const editHint = document.getElementById('editHint');

            const resetBtn = document.getElementById('resetDataBtn');
            const exportBtn = document.getElementById('exportBtn');
            const toastEl = document.getElementById('toast');

            let toastTimer = null;

            // ----- helpers -----
            function slugify(str) {
                return str
                    .toLowerCase()
                    .trim()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/[\s_-]+/g, '-')
                    .replace(/^-+|-+$/g, '');
            }

            function formatDate(ts) {
                const d = new Date(ts);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            // ----- toast -----
            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            // ----- render entries -----
            function render() {
                // clear rows (keep header)
                const headerRow = entryListEl.querySelector('.header-row');
                entryListEl.innerHTML = '';
                entryListEl.appendChild(headerRow);

                if (entries.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = '⏻ no entries yet · create one below';
                    entryListEl.appendChild(empty);
                } else {
                    entries.forEach(entry => {
                        const row = document.createElement('div');
                        row.className = 'entry-row';
                        row.dataset.id = entry.id;

                        const statusClass = entry.status === 'published' ? 'published' : 'draft';

                        row.innerHTML = `
                            <div class="entry-cell title">${escapeHtml(entry.title) || 'untitled'}</div>
                            <div class="entry-cell">/${escapeHtml(entry.slug) || '—'}</div>
                            <div class="entry-cell status"><span class="status-badge ${statusClass}">${entry.status}</span></div>
                            <div class="entry-cell">${formatDate(entry.updated)}</div>
                            <div class="entry-cell entry-actions">
                                <button class="edit-btn" data-id="${entry.id}">✎</button>
                                <button class="delete-btn" data-id="${entry.id}">✕</button>
                            </div>
                        `;
                        entryListEl.appendChild(row);
                    });
                }

                // update stats
                const total = entries.length;
                const published = entries.filter(e => e.status === 'published').length;
                const drafts = total - published;
                entryCountEl.textContent = total;
                publishedCountEl.textContent = published;
                draftCountEl.textContent = drafts;

                // attach event listeners to buttons
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = parseInt(btn.dataset.id);
                        startEdit(id);
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = parseInt(btn.dataset.id);
                        deleteEntry(id);
                    });
                });
            }

            // simple escape
            function escapeHtml(text) {
                if (!text) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, function(m) { return map[m]; });
            }

            // ----- CRUD -----
            function getNextId() {
                return nextId++;
            }

            function addEntry(title, slug, status) {
                const entry = {
                    id: getNextId(),
                    title: title.trim() || 'untitled',
                    slug: slug.trim() || slugify(title) || 'entry-' + Date.now(),
                    status: status || 'draft',
                    updated: Date.now(),
                };
                entries.push(entry);
                render();
                showToast(`✔ created “${entry.title}”`);
                return entry;
            }

            function updateEntry(id, title, slug, status) {
                const entry = entries.find(e => e.id === id);
                if (!entry) return null;
                entry.title = title.trim() || 'untitled';
                entry.slug = slug.trim() || slugify(title) || 'entry-' + Date.now();
                entry.status = status || 'draft';
                entry.updated = Date.now();
                render();
                showToast(`✔ updated “${entry.title}”`);
                return entry;
            }

            function deleteEntry(id) {
                const entry = entries.find(e => e.id === id);
                if (!entry) return;
                if (!confirm(`Delete “${entry.title}” ?`)) return;
                entries = entries.filter(e => e.id !== id);
                if (editingId === id) cancelEdit();
                render();
                showToast(`✕ deleted “${entry.title}”`);
            }

            // ----- edit state -----
            function startEdit(id) {
                const entry = entries.find(e => e.id === id);
                if (!entry) return;
                editingId = id;
                titleInput.value = entry.title;
                slugInput.value = entry.slug;
                statusSelect.value = entry.status;
                editHint.textContent = `✎ editing “${entry.title}”`;
                saveBtn.textContent = '💾 update';
                cancelBtn.style.display = 'inline-flex';
            }

            function cancelEdit() {
                editingId = null;
                titleInput.value = '';
                slugInput.value = '';
                statusSelect.value = 'draft';
                editHint.textContent = '— create new entry';
                saveBtn.textContent = '+ save';
                cancelBtn.style.display = 'none';
            }

            // ----- save (create or update) -----
            function handleSave() {
                const title = titleInput.value.trim();
                const slug = slugInput.value.trim();
                const status = statusSelect.value;

                if (!title) {
                    showToast('⚠ please enter a title');
                    titleInput.focus();
                    return;
                }

                if (editingId) {
                    updateEntry(editingId, title, slug, status);
                    cancelEdit();
                } else {
                    addEntry(title, slug, status);
                    titleInput.value = '';
                    slugInput.value = '';
                    statusSelect.value = 'draft';
                    titleInput.focus();
                }
            }

            // ----- reset to sample data -----
            function resetData() {
                if (!confirm('Reset all entries?')) return;
                entries = [];
                nextId = 1;
                cancelEdit();
                
                // Add sample entries
                addEntry('Getting Started with Void', 'getting-started', 'published');
                addEntry('Headless CMS Architecture', 'headless-architecture', 'published');
                addEntry('Content Modeling Guide', 'content-modeling', 'draft');
                addEntry('API Authentication', 'api-auth', 'draft');
                
                showToast('⟲ reset to sample data');
            }

            // ----- export JSON -----
            function exportData() {
                const data = JSON.stringify(entries, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `void-export-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('⬇ exported ' + entries.length + ' entries');
            }

            // ----- init -----
            function init() {
                // Reset to sample data on load
                resetData();

                // Event listeners
                saveBtn.addEventListener('click', handleSave);
                cancelBtn.addEventListener('click', cancelEdit);
                resetBtn.addEventListener('click', resetData);
                exportBtn.addEventListener('click', exportData);

                // Enter key on title/slug fields
                titleInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        slugInput.focus();
                    }
                });
                slugInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSave();
                    }
                });

                // Auto-generate slug from title
                titleInput.addEventListener('blur', () => {
                    if (!slugInput.value.trim() && titleInput.value.trim()) {
                        slugInput.value = slugify(titleInput.value);
                    }
                });

                // Hide cancel button initially
                cancelBtn.style.display = 'none';

                console.log('⚡ Void CMS ready');
            }

            // Start the app
            init();

        })();
    </script>
</body>
</html>
