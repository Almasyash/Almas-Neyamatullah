<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="45%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>

        <linearGradient id="crystalFacet" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0e2a47" />
            <stop offset="100%" stop-color="#071322" />
        </linearGradient>

        <linearGradient id="innerCyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="60%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>

        <filter id="cyanGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Dark rounded badge base for standalone contrast -->
    <rect width="100" height="100" rx="22" fill="#070a12" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5" />

    <!-- EXACT CHOSEN CRYSTAL M LOGO -->
    <g id="chosen-crystal-m">
        <!-- 1. Ambient Glowing Under-Stroke -->
        <path d="M 18,14 L 18,52 L 32,86 L 50,68 L 68,86 L 82,52 L 82,14 L 64,40 L 50,56 L 36,40 Z" 
              fill="none" 
              stroke="#00f2fe" 
              stroke-width="5" 
              stroke-linejoin="round" 
              filter="url(#cyanGlowEffect)" 
              opacity="0.85" />

        <!-- 2. Outer Crystal Wings (Left & Right) -->
        <!-- Left Wing Facet -->
        <polygon points="18,14 18,52 32,86 36,54 28,34" 
                 fill="url(#crystalFacet)" 
                 stroke="url(#neonCyan)" 
                 stroke-width="2.2" 
                 stroke-linejoin="round" />
        
        <!-- Right Wing Facet -->
        <polygon points="82,14 82,52 68,86 64,54 72,34" 
                 fill="url(#crystalFacet)" 
                 stroke="url(#neonCyan)" 
                 stroke-width="2.2" 
                 stroke-linejoin="round" />

        <!-- 3. Inner Center V Chevrons (Faceted 3D Crystal) -->
        <!-- Center Bottom Ridge -->
        <polygon points="36,54 50,68 64,54 50,44" 
                 fill="#091a2e" 
                 stroke="#38bdf8" 
                 stroke-width="1.8" />

        <!-- Upper Floating Cyan Chevron -->
        <path d="M 28,26 L 50,50 L 72,26 L 62,26 L 50,40 L 38,26 Z" 
              fill="url(#innerCyanGlow)" 
              filter="url(#cyanGlowEffect)" />

        <!-- Sharp Outer Bevel Lines for Crystal Edge Reflections -->
        <line x1="18" y1="14" x2="36" y2="54" stroke="#e0f2fe" stroke-width="1.6" opacity="0.9" />
        <line x1="82" y1="14" x2="64" y2="54" stroke="#e0f2fe" stroke-width="1.6" opacity="0.9" />
        <line x1="32" y1="86" x2="50" y2="68" stroke="#00f2fe" stroke-width="2" />
        <line x1="68" y1="86" x2="50" y2="68" stroke="#00f2fe" stroke-width="2" />
    </g>
</svg>
